files:
  api:
    files:
      - "tests/example/openapi.yaml"
processes:
  openAPI:
    params:
      Package: foji/tests/example
      Auth: ExampleAuth
    OpenAPIFile:
      tests/example/http_handler_gen.go: foji/openapi/handler.go.tpl
      tests/example/model_gen.go: foji/openapi/model.go.tpl
  openAPIClient:
    params:
      Package: foji/tests/example
      Auth: ExampleAuth
      TypePrefix: Example
    OpenAPIFile:
      tests/example/client_model_gen.go: foji/openapi/model.go.tpl
      tests/example/http_client_gen.go: foji/openapi/client.go.tpl
